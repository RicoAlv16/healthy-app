name: Care.bj Build Validation & Vercel Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Validation de la Compilation (sans bloquer sur le linting)
  build-validation:
    name: 📦 Validation Build Next.js
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Génération Client Prisma
        run: npx prisma generate

      - name: Test de Build Next.js
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test_ci?schema=public"
          JWT_SECRET: "ci_cd_test_secret_key_for_build_validation_only"
          NODE_ENV: "production"
        run: npm run build

      - name: Statut Déploiement Vercel
        run: |
          echo "=========================================================="
          echo "✅ Compilation Next.js validée avec succès !"
          echo "🚀 Le déploiement en production est pris en charge"
          echo "   automatiquement et directement par Vercel."
          echo "=========================================================="
